image:
  repository: opskeeper
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

basePath: /opskeeper
logHealthIgnore: true
existingSecret: opskeeper-runtime
trustedProxies: ""
otelExporterEndpoint: ""
cacheBackend: postgres
storageBackend: postgres
storageS3Provider: minio

operation:
  enabled: false

api:
  replicas: 2
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
worker:
  replicas: 2
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
scheduler:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

service:
  type: ClusterIP
  port: 80
ingress:
  enabled: false
  className: ""
  host: opskeeper.example.com
  tlsSecretName: ""
  annotations: {}

pdb:
  enabled: true
  minAvailable: 1
hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

networkPolicy:
  enabled: true
  ingressNamespaceSelector: {}
  databaseCIDR: 10.0.0.0/8
  databasePort: 5432
  allowExternalHTTPS: true

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
