<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>权限卡片 · 10 种方案预览</title>
<style>
:root{color-scheme:light;--page:#f4f6f8;--surface:#fff;--raised:#f8fafb;--soft:#eef2f5;--text:#202832;--muted:#71808d;--border:#d7e0e6;--divider:#e7edf1;--accent:#287f78;--accent-soft:#e8f5f2;--platform:#3f62a1;--platform-soft:#eaf0fb;--team:#21846f;--team-soft:#e7f5ef;--project:#6756a3;--project-soft:#f0edfa;--admin:#b14d4d;--operator:#b56a1f;--viewer:#5b6c7c;--shadow:0 8px 24px #24374612;font:13px Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
:root.dark{color-scheme:dark;--page:#171d22;--surface:#20282f;--raised:#273139;--soft:#2c3740;--text:#edf3f6;--muted:#9eafb9;--border:#3b4a55;--divider:#303d46;--accent:#70c8b4;--accent-soft:#1e3c3a;--platform:#9fc4ef;--platform-soft:#263852;--team:#7ee0bd;--team-soft:#1c443b;--project:#c7b9f0;--project-soft:#372e4f;--admin:#f09a9a;--operator:#f0b36d;--viewer:#a9c7df;--shadow:0 12px 30px #00000035}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text)}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.shell{max-width:1420px;margin:auto;padding:28px}.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:20px}.eyebrow{margin:0 0 6px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.14em}.topbar h1{margin:0;font-size:26px;letter-spacing:-.02em}.topbar p{margin:6px 0 0;color:var(--muted);line-height:1.5}.actions{display:flex;align-items:center;gap:8px}.button{padding:8px 11px;border:1px solid var(--border);border-radius:6px;background:var(--surface)}.button:hover{border-color:var(--accent)}.button.primary{color:#fff;background:var(--accent);border-color:var(--accent)}.picker{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}.picker button{padding:7px 10px;color:var(--muted);background:transparent;border:1px solid var(--border);border-radius:5px;font-size:11px}.picker button.active{color:var(--text);background:var(--accent-soft);border-color:var(--accent)}.stage{padding:18px;background:var(--surface);border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow)}.stage-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.stage-head h2{margin:0;font-size:15px}.stage-head p{margin:4px 0 0;color:var(--muted);font-size:11px}.stage-head small{color:var(--muted);font-size:10px}.samples{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.sample{min-width:0;padding:13px;border:1px solid var(--border);border-radius:7px;background:var(--raised)}.sample-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}.sample-title strong{font-size:12px}.sample-title small{color:var(--muted);font-size:10px}.permission{min-width:0}.permission+.permission{margin-top:7px}.level{display:inline-flex;align-items:center;gap:4px;padding:3px 6px;border-radius:4px;font-size:9px;font-weight:750;letter-spacing:.02em}.level.platform{color:var(--platform);background:var(--platform-soft)}.level.team{color:var(--team);background:var(--team-soft)}.level.project{color:var(--project);background:var(--project-soft)}.object{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.role{flex:0 0 auto;font-weight:750;white-space:nowrap}.role.admin{color:var(--admin)}.role.operator{color:var(--operator)}.role.viewer{color:var(--viewer)}.muted{color:var(--muted)}
/* 01: label + content */.v1 .permission{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;padding:8px 9px;background:var(--surface);border:1px solid var(--border);border-radius:6px}.v1 .object{font-weight:650}.v1 .role{font-size:10px}
/* 02: level rail */.v2 .permission{display:grid;grid-template-columns:3px auto minmax(0,1fr);align-items:center;gap:8px;padding:8px 9px;background:var(--surface);border:1px solid var(--border);border-radius:6px}.v2 .permission:before{align-self:stretch;border-radius:3px;background:var(--platform);content:""}.v2 .permission.team:before{background:var(--team)}.v2 .permission.project:before{background:var(--project)}.v2 .object{font-weight:650}.v2 .role{grid-column:3;color:var(--muted);font-size:10px}
/* 03: three compact columns */.v3 .permission{display:grid;grid-template-columns:50px minmax(0,1fr) auto;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--divider)}.v3 .permission:last-child{border-bottom:0}.v3 .object{font-weight:650}.v3 .role{padding-left:8px;border-left:1px solid var(--border);font-size:10px}
/* 04: role badge */.v4 .permission{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:8px;padding:8px 9px;background:var(--surface);border:1px solid var(--border);border-radius:6px}.v4 .object{font-weight:650}.v4 .role{grid-column:2;width:max-content;margin-top:-3px;padding:2px 6px;border-radius:4px;background:var(--soft);font-size:10px}.v4 .role.admin{background:color-mix(in srgb,var(--admin) 14%,var(--surface))}.v4 .role.operator{background:color-mix(in srgb,var(--operator) 14%,var(--surface))}.v4 .role.viewer{background:color-mix(in srgb,var(--viewer) 14%,var(--surface))}
/* 05: breadcrumb */.v5 .permission{display:flex;align-items:center;gap:7px;padding:9px;background:var(--surface);border:1px solid var(--border);border-radius:6px}.v5 .level{padding:0;color:var(--muted);background:none}.v5 .level:after{content:"/";margin-left:3px;color:var(--border)}.v5 .object{font-weight:650}.v5 .role{margin-left:auto;font-size:10px}
/* 06: top accent */.v6 .permission{position:relative;padding:10px 10px 9px;background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden}.v6 .permission:before{position:absolute;top:0;right:0;left:0;height:3px;background:var(--platform);content:""}.v6 .permission.team:before{background:var(--team)}.v6 .permission.project:before{background:var(--project)}.v6 .level{margin-right:5px;padding:0;background:none}.v6 .object{display:inline;font-weight:650}.v6 .role{display:block;margin-top:6px;font-size:10px}
/* 07: split cells */.v7 .permission{display:grid;grid-template-columns:62px minmax(0,1fr) auto;align-items:stretch;min-height:38px;background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden}.v7 .level{display:flex;justify-content:center;border-radius:0}.v7 .object{display:flex;align-items:center;padding:7px 8px;font-weight:650;border-left:1px solid var(--border)}.v7 .role{display:flex;align-items:center;padding:0 8px;font-size:10px;border-left:1px solid var(--border)}
/* 08: compact icon */.v8 .permission{display:grid;grid-template-columns:25px minmax(0,1fr) auto;align-items:center;gap:7px;padding:8px 9px;background:var(--surface);border:1px solid var(--border);border-radius:6px}.v8 .level{display:grid;place-items:center;width:23px;height:23px;padding:0;border-radius:50%;font-size:0}.v8 .level:before{font-size:11px}.v8 .level.platform:before{content:"P"}.v8 .level.team:before{content:"T"}.v8 .level.project:before{content:"J"}.v8 .object{font-weight:650}.v8 .role{font-size:10px}
/* 09: object first */.v9 .permission{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding:8px 9px;background:var(--surface);border-left:3px solid var(--platform);border-top:1px solid var(--border);border-right:1px solid var(--border);border-bottom:1px solid var(--border);border-radius:5px}.v9 .permission.team{border-left-color:var(--team)}.v9 .permission.project{border-left-color:var(--project)}.v9 .object{font-weight:650}.v9 .level{display:inline-flex;margin-right:5px;padding:0;background:none;font-weight:600}.v9 .level:after{content:"·";margin-left:5px;color:var(--muted)}.v9 .role{grid-column:2;grid-row:1;font-size:10px}
/* 10: dense token */.v10 .permission{display:flex;align-items:center;gap:6px;min-width:0;padding:7px 8px;background:var(--surface);border:1px solid var(--border);border-radius:5px}.v10 .permission.admin{background:color-mix(in srgb,var(--admin) 11%,var(--surface));border-color:color-mix(in srgb,var(--admin) 42%,var(--border))}.v10 .permission.operator{background:color-mix(in srgb,var(--operator) 11%,var(--surface));border-color:color-mix(in srgb,var(--operator) 42%,var(--border))}.v10 .permission.viewer{background:color-mix(in srgb,var(--viewer) 11%,var(--surface));border-color:color-mix(in srgb,var(--viewer) 42%,var(--border))}.v10 .level{padding:2px 5px}.v10 .object{font-weight:650}.v10 .role{margin-left:auto;padding-left:7px;border-left:1px solid currentColor;font-size:10px}.v10 .role.admin{color:var(--admin)}.v10 .role.operator{color:var(--operator)}.v10 .role.viewer{color:var(--viewer)}
@media(max-width:980px){.samples{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.shell{padding:16px}.topbar{align-items:flex-start;flex-direction:column}.samples{grid-template-columns:1fr}.stage{padding:13px}}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar"><div><p class="eyebrow">ACCESS DESIGN EXPLORATION</p><h1>权限卡片</h1><p>10 种“级别 · 对象 · 角色”的紧凑展示方案，支持明暗主题对比。</p></div><div class="actions"><button class="button" id="theme">切换主题</button></div></header>
  <nav class="picker" aria-label="权限卡片方案"><button class="active" data-view="v1">01 · 标签行</button><button data-view="v2">02 · 级别色条</button><button data-view="v3">03 · 三列清单</button><button data-view="v4">04 · 角色徽章</button><button data-view="v5">05 · 面包屑</button><button data-view="v6">06 · 顶部色线</button><button data-view="v7">07 · 分格卡片</button><button data-view="v8">08 · 级别图标</button><button data-view="v9">09 · 对象优先</button><button data-view="v10">10 · 密集令牌</button></nav>
  <section class="stage"><div class="stage-head"><div><h2 id="title">01 · 标签行</h2><p id="desc">级别标签、对象名称、角色并排，适合常规成员列表。</p></div><small>示例用户：林晓 · 3 个授权</small></div>
    <div class="samples v1" id="preview">
      <article class="sample"><div class="sample-title"><strong>混合级别</strong><small>3 张卡片</small></div><div class="permission platform admin"><span class="level platform">平台</span><span class="object">OpsKeeper</span><span class="role admin">管理员</span></div><div class="permission team operator"><span class="level team">团队</span><span class="object">支付平台</span><span class="role operator">操作员</span></div><div class="permission project viewer"><span class="level project">项目</span><span class="object">支付平台 / 订单服务</span><span class="role viewer">观察员</span></div></article>
      <article class="sample"><div class="sample-title"><strong>另一个成员</strong><small>2 张卡片</small></div><div class="permission team admin"><span class="level team">团队</span><span class="object">SRE 运维</span><span class="role admin">管理员</span></div><div class="permission project operator"><span class="level project">项目</span><span class="object">SRE 运维 / 监控中心</span><span class="role operator">操作员</span></div></article>
      <article class="sample"><div class="sample-title"><strong>只读成员</strong><small>1 张卡片</small></div><div class="permission project viewer"><span class="level project">项目</span><span class="object">支付平台 / 账单服务</span><span class="role viewer">观察员</span></div></article>
    </div>
  </section>
</div>
<script>
const descriptions={v1:['01 · 标签行','级别标签、对象名称、角色并排，适合常规成员列表。'],v2:['02 · 级别色条','用左侧细色条区分级别，角色降为第二行，信息层级更清楚。'],v3:['03 · 三列清单','固定级别、对象、角色三列，适合高密度权限列表。'],v4:['04 · 角色徽章','对象作为主信息，角色用紧凑徽章放在下一行。'],v5:['05 · 面包屑','级别与对象形成短路径，角色贴右，适合横向空间有限的表格。'],v6:['06 · 顶部色线','卡片顶部色线表示级别，卡片内容保持轻量。'],v7:['07 · 分格卡片','级别、对象、角色分成三个视觉单元，扫描速度快。'],v8:['08 · 级别图标','用 P / T / J 的圆形标记替代重复级别文字，节省宽度。'],v9:['09 · 对象优先','对象名称最突出，左侧色线和级别短标签提供上下文。'],v10:['10 · 密集令牌','最小高度的令牌式卡片，适合一行容纳多个权限。']};
const picker=[...document.querySelectorAll('[data-view]')],preview=document.getElementById('preview'),title=document.getElementById('title'),desc=document.getElementById('desc');picker.forEach(button=>button.addEventListener('click',()=>{const view=button.dataset.view;picker.forEach(item=>item.classList.toggle('active',item===button));preview.className='samples '+view;title.textContent=descriptions[view][0];desc.textContent=descriptions[view][1]}));
document.getElementById('theme').addEventListener('click',()=>document.documentElement.classList.toggle('dark'));
</script>
</body>
</html>
