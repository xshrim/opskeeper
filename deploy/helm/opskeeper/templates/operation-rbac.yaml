{{- if .Values.operation.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opskeeper-operation-runner
  labels:
    {{- include "opskeeper.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "opskeeper.fullname" . }}-operation-runner
  labels:
    {{- include "opskeeper.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "opskeeper.fullname" . }}-operation-runner
  labels:
    {{- include "opskeeper.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: opskeeper-operation-runner
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "opskeeper.fullname" . }}-operation-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "opskeeper.fullname" . }}-operation-submitter
  labels:
    {{- include "opskeeper.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "opskeeper.fullname" . }}-operation-submitter
  labels:
    {{- include "opskeeper.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "opskeeper.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "opskeeper.fullname" . }}-operation-submitter
{{- end }}
