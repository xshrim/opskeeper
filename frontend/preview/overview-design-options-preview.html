    .scheme-tabs { display: flex; gap: 5px; overflow-x: auto; padding: 2px 1px 9px; scrollbar-width: thin; }

    .scheme-tabs .active b { color: white; background: #187755; }
    .preview-shell { --ink: #202a28; --muted: #687772; --line: #dce4e0; --surface: #fff; --canvas: #f5f7f6; --accent: #197757; --soft: #e7f4ed; --warn: #b87319; --warn-soft: #fff4df; --bad: #b94a42; --bad-soft: #fff0ed; --cold: #4676a8; --cold-soft: #eaf2fa; overflow: hidden; color: var(--ink); background: var(--canvas); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 9px 30px #1d352713; }

    .card-pad { padding: 11px; }
    .metric { min-width: 0; padding: 11px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }

    .metric small { display: block; margin-top: 7px; color: var(--muted); font-size: 9px; }
    .metric .up { color: var(--accent); }

    .table-wrap { overflow-x: auto; }
    .section-label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 1px 0 7px; color: var(--muted); font-size: 8px; font-weight: 800; letter-spacing: .06em; }

    .toast.show { opacity: 1; transform: translateY(0); }
    /* Distinct design directions */

<body>
  <header class="preview-head">
    <div class="brandline"><span class="brand-mark">O</span><span><strong>OpsKeeper · 总览方案展厅</strong><small>10 种差异化信息架构 · 静态交互预览，不修改现有总览</small></span></div>
    <div class="control-area"><span class="control-label">预览范围</span><div class="segmented" id="scopes" role="group" aria-label="预览范围"><button class="active" data-scope="platform">平台</button><button data-scope="team">团队</button><button data-scope="project">项目</button></div></div>
  </header>
  <main class="main">
    <div class="intro"><div><p class="eyebrow">OVERVIEW DESIGN OPTIONS</p><h1>选择总览的状态组织方式</h1><p>十个方向均围绕“看清整体状态，并快速进入需要处理的位置”设计。</p></div><span class="scope-caption">当前示例：<b id="scopeName">平台全域</b></span></div>
    <nav class="scheme-tabs" id="schemeTabs" aria-label="总览设计方案"></nav>
    <section id="preview" class="preview-shell" aria-live="polite"></section>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const scopeData = {
      platform: { label: '平台全域', team: '支付研发部', project: '统一支付平台', app: 'payment-api', secondary: '账户服务', teams: 12, projects: 86, apps: 314, instances: 728, healthyInstances: 714, resources: 146, healthy: 297, warnings: 11, critical: 6, alerts: 17, inspections: 24, coverage: 94, diagnoses: 9, events: 42, engines: 5, skills: 18, experts: 12 },

    const metric = (label, value, note, tone = '') => `<article class="metric"><label>${label}<span>${spark()}</span></label><strong>${n(value)}</strong><small class="${tone}">${note}</small></article>`;

    const row = (icon, name, detail, end, tone = '') => `<div class="row"><span class="icon-square">${icon}</span><span class="row-copy"><strong>${name}</strong><small>${detail}</small></span><span class="row-end">${tone ? pill(end, tone) : end}</span></div>`;

    function content(index, d) {

      const activity = `<div class="event"><time>10:42 · 智能诊断</time><strong>${d.app} 的 CPU 使用率异常</strong><p>已关联运行时实例与 PostgreSQL 指标，等待分析结论。</p></div><div class="event"><time>10:18 · 巡检</time><strong>${d.project} 日常巡检完成</strong><p>${d.coverage}% 检查项通过，1 项需要跟进。</p></div><div class="event"><time>09:56 · 资源</time><strong>Redis 连接测试成功</strong><p>由资源配置变更后的自动连接测试产生。</p></div>`;
      if (index === 0) return shell(d, `${baseMetrics}<div class="two-col">${card('需要关注', alertList, `${d.alerts} 项`)}${card('运行健康', healthList, '应用与资源')}</div>${`<div class="three-col">${card('智能巡检', `<div class="section-label"><span>今日完成</span><b>${d.coverage}%</b></div><div class="bar"><span style="width:${d.coverage}%"></span></div><p class="meta" style="margin:9px 0 0">${d.inspections} 个策略运行 · ${Math.max(1, d.critical)} 项待复核</p>`)}${card('智能诊断', `<strong style="font-size:23px">${d.diagnoses}</strong><span class="meta"> 个进行中会话</span><p class="meta" style="margin:7px 0 0">应用、实例与关联资源上下文</p>`) }${card('平台能力', `<div class="meta">${d.engines} 模型引擎 · ${d.skills} 项技能 · ${d.experts} 位专家</div><p style="margin:9px 0 0"><button class="text-link jump">查看 AI 配置 →</button></p>`)}</div>`}`);
      if (index === 1) return shell(d, `<div class="two-col"><section style="padding:12px 3px 8px"><p class="eyebrow" style="color:var(--accent)">DAILY BRIEF · ${d.label}</p><h2 style="max-width:560px;margin:0 0 10px;font-size:20px;line-height:1.45">整体运行平稳，<span style="color:var(--warn)">${d.alerts} 项异常</span>需要优先核实。</h2><p class="meta" style="max-width:600px;line-height:1.8">当前范围包含 ${d.projects} 个项目、${d.apps} 个应用和 ${d.resources} 个关联资源。${d.critical ? `${d.app} 存在运行实例指标异常，建议先查看应用诊断。` : '当前没有高优先级服务中断，可继续关注巡检与资源连接状态。'}</p><button class="small-button jump">打开异常清单 →</button></section><div class="grid-3">${metric('应用', d.apps, '总量')}${metric('健康', d.healthy, '状态正常', 'up')}${metric('实例', d.instances, '运行中')}</div></div><div class="three-col">${card('服务状态', healthList)}${card('风险与告警', alertList)}${card('近期变化', activity)}</div>`);
      if (index === 2) return shell(d, `${baseMetrics}<div class="two-col"><div class="card"><div class="card-head"><strong>服务健康分区</strong><small>按应用与实例状态聚合</small></div><div class="card-pad">${healthList}<div class="row"><span class="row-copy"><strong>巡检覆盖</strong><small>${d.inspections} 个策略 · 今日执行</small></span><span class="row-end">${d.coverage}%</span></div><div class="bar"><span style="width:${d.coverage}%"></span></div></div></div>${card('异常响应', alertList)}</div><div class="three-col">${card('资源可用性', `<strong style="font-size:22px">${Math.max(0, d.resources - 1)} / ${d.resources}</strong><p class="meta">资源连接正常 · 代码仓库读取可用</p>`)}${card('诊断活动', `<strong style="font-size:22px">${d.diagnoses}</strong><p class="meta">个活跃会话 · ${d.events} 条范围内事件</p>`)}${card('配置能力', `<strong style="font-size:22px">${d.engines}</strong><p class="meta">模型引擎 · ${d.skills} 技能 · ${d.experts} 专家</p>`)}</div>`, '');
      if (index === 3) return shell(d, `${baseMetrics}<div class="card"><div class="card-head"><strong>服务关系与影响路径</strong><span class="meta">应用 → 实例 → 运行时 / 资源</span></div><div class="topology"><svg viewBox="0 0 800 280" preserveAspectRatio="none"><line x1="145" y1="57" x2="372" y2="68"/><line x1="455" y1="66" x2="655" y2="56"/><line x1="145" y1="57" x2="282" y2="220"/><line x1="422" y1="74" x2="533" y2="215"/><line x1="650" y1="65" x2="542" y2="217"/></svg><div class="node n1"><b>${d.app}</b><small>应用 · ${d.instances} 实例</small></div><div class="node n2"><b>Docker</b><small>运行时 · 3 实例</small></div><div class="node n3 alert"><b>PostgreSQL</b><small>数据库 · 延迟告警</small></div><div class="node n4"><b>${d.secondary}</b><small>应用 · 2 实例</small></div><div class="node n5"><b>Redis</b><small>缓存 · 正常</small></div></div></div><div class="two-col">${card('影响中', alertList)}${card('快速进入', `${row('P', d.project, '项目驾驶舱', '打开')}${row('D', '智能诊断', '新建或继续诊断会话', '进入')}${row('I', '智能巡检', '策略与执行记录', '查看')}`)}</div>`);
      if (index === 4) return shell(d, `${baseMetrics}<div class="two-col"><div class="card"><div class="card-head"><strong>范围内事件流</strong><small>最近 ${d.events} 条 · 自动刷新</small></div><div class="card-pad timeline">${activity}<div class="event"><time>09:32 · 应用变更</time><strong>${d.secondary} 发布新版本</strong><p>关联 Bundle 仓库已完成预览和内容校验。</p></div></div></div><div>${card('当前未处理', alertList)}<div style="height:10px"></div>${card('今日运行', `<div class="row"><span class="row-copy"><strong>巡检执行</strong><small>成功完成</small></span><b>${d.inspections}</b></div><div class="row"><span class="row-copy"><strong>诊断会话</strong><small>活跃分析</small></span><b>${d.diagnoses}</b></div><div class="row"><span class="row-copy"><strong>资源连接测试</strong><small>自动与手动</small></span><b>${d.resources}</b></div>`)}</div></div>`);

      if (index === 6) return shell(d, `${baseMetrics}<div class="two-col"><div class="card"><div class="card-head"><strong>范围资源星图</strong><small>按对象类型与健康状态</small></div><div class="card-pad radial"><div class="orbit"><div class="orbit-center"><strong>${d.resources}</strong><small>关联资源</small></div></div><div class="legend"><div class="legend-item"><i></i><span>运行时</span><b>${Math.ceil(d.resources * .24)}</b></div><div class="legend-item"><i></i><span>数据库与缓存</span><b>${Math.ceil(d.resources * .31)}</b></div><div class="legend-item"><i></i><span>代码与配置</span><b>${Math.ceil(d.resources * .25)}</b></div><div class="legend-item"><i></i><span>消息与存储</span><b>${Math.floor(d.resources * .2)}</b></div></div></div></div><div>${card('关键应用', `${row('A', d.app, '运行健康 · 3 实例', '正常')}${row('A', d.secondary, '运行健康 · 2 实例', '关注', 'warn')}${row('A', 'settlement-worker', 'Kubernetes · 4 实例', '正常')}`)}<div style="height:10px"></div>${card('容量与连接', `<div class="section-label"><span>资源连接成功率</span><b>96%</b></div><div class="bar"><span style="width:96%"></span></div><p class="meta" style="margin:9px 0 0">最近 24 小时 · ${d.resources} 个可见资源</p>`)}</div></div>`);
      if (index === 7) return shell(d, `${baseMetrics}<div class="two-col"><div><div class="section-label"><span>快速进入工作</span><button class="text-link jump">自定义入口</button></div><div class="launcher"><button class="launch-item jump"><i class="icon-square">D</i><span><b>智能诊断</b><small>${d.diagnoses} 个会话进行中</small></span></button><button class="launch-item jump"><i class="icon-square">I</i><span><b>智能巡检</b><small>${d.inspections} 项计划与执行</small></span></button><button class="launch-item jump"><i class="icon-square">P</i><span><b>项目驾驶舱</b><small>${d.projects} 个项目</small></span></button><button class="launch-item jump"><i class="icon-square">R</i><span><b>资源管理</b><small>${d.resources} 个关联资源</small></span></button><button class="launch-item jump"><i class="icon-square">M</i><span><b>模型引擎</b><small>${d.engines} 个可用引擎</small></span></button><button class="launch-item jump"><i class="icon-square">A</i><span><b>权限审计</b><small>角色、授权与变更记录</small></span></button></div></div><div>${card('需要你处理', alertList)}<div style="height:10px"></div>${card('运行状态', healthList)}</div></div><div class="three-col">${card('能力目录', `<div class="meta">${d.skills} 技能 · ${d.experts} 专家 · ${d.engines} 模型引擎</div>`)}${card('自动化', `<div class="meta">${d.inspections} 巡检计划 · ${d.coverage}% 覆盖</div>`)}${card('活动', `<div class="meta">${d.events} 条近期事件</div>`)}</div>`);
      if (index === 8) return shell(d, `${baseMetrics}<div class="queue"><div class="queue-head">待处理告警 <span class="queue-count">${d.alerts}</span></div>${alertList}</div><div class="queue"><div class="queue-head">巡检待复核 <span class="queue-count">${Math.max(1, d.critical)}</span></div>${row('I', `${d.project} 日常巡检`, '1 项检查结果需要确认', '待复核', 'warn')}${row('I', '资源连接巡检', '检查凭证有效期与连通性', '进行中', 'cold')}${row('I', '应用实例巡检', '覆盖率已达 ' + d.coverage + '%', '通过')}</div><div class="queue"><div class="queue-head">诊断与变更 <span class="queue-count">${d.diagnoses}</span></div>${row('D', `${d.app} 资源使用率分析`, '运行时与依赖资源采集中', '分析中', 'cold')}${row('P', `${d.secondary} 发布完成`, '版本 v2.8.1 · 09:32', '已完成')}${row('R', 'Redis 连接状态恢复', '自动测试 · 09:56', '已恢复')}</div><div class="card" style="grid-column:1/-1"><div class="card-head"><strong>范围覆盖</strong><small>项目 → 应用 → 实例 → 资源</small></div><div class="card-pad grid-4">${metric('项目', d.projects, '纳入当前范围')}${metric('应用', d.apps, '状态持续汇总')}${metric('运行实例', d.instances, '由应用拓扑识别')}${metric('巡检覆盖', `${d.coverage}%`, '策略检查项覆盖')}</div></div>`, '');
      return shell(d, `${baseMetrics}<div class="two-col"><div class="card"><div class="card-head"><strong>范围关键指标</strong><small>与上一周期比较</small></div><div class="table-wrap"><table class="table"><thead><tr><th>指标</th><th>当前</th><th>趋势</th><th>状态</th></tr></thead><tbody><tr><td>健康应用</td><td>${n(d.healthy)} / ${n(d.apps)}</td><td style="color:var(--accent)">↑ 2.4%</td><td>${pill('稳定')}</td></tr><tr><td>实例可用性</td><td>99.92%</td><td style="color:var(--accent)">↑ 0.08%</td><td>${pill('达标')}</td></tr><tr><td>巡检覆盖率</td><td>${d.coverage}%</td><td style="color:var(--warn)">↓ 1.2%</td><td>${pill('关注', 'warn')}</td></tr><tr><td>高优先级告警</td><td>${d.critical}</td><td style="color:var(--bad)">↑ 1</td><td>${pill(d.critical ? '需处理' : '正常', d.critical ? 'bad' : '')}</td></tr></tbody></table></div></div>${card('只看例外', alertList)}</div><div class="three-col">${card('运行规模', `<strong style="font-size:22px">${n(d.projects)}</strong><p class="meta">项目 · ${n(d.apps)} 应用 · ${n(d.instances)} 实例</p>`)}${card('平台能力', `<strong style="font-size:22px">${d.engines}</strong><p class="meta">模型引擎 · ${d.skills} 技能 · ${d.experts} 专家</p>`)}${card('近期活动', `<strong style="font-size:22px">${d.events}</strong><p class="meta">条事件 · ${d.diagnoses} 个诊断会话</p>`)}</div>`);
    }
    function renderTabs() {
      tabRoot.innerHTML = schemes.map(([title, desc], index) => `<button class="${index === activeScheme ? 'active' : ''}" data-index="${index}" aria-pressed="${index === activeScheme}"><b>${String(index + 1).padStart(2, '0')}</b><span>${title}</span></button>`).join('');
      tabRoot.querySelectorAll('button').forEach((button) => button.addEventListener('click', () => { activeScheme = Number(button.dataset.index); render(); }));
    }
    function render() {
      renderTabs();
      const data = scopeData[activeScope];
      scopeName.textContent = data.label;
      preview.className = `preview-shell style-${activeScheme + 1}`;
      preview.innerHTML = content(activeScheme, data);
      preview.querySelectorAll('.jump').forEach((button) => button.addEventListener('click', () => showToast('静态预览入口：实际页面跳转未启用。')));
    }
    let toastTimer;
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    }
    document.querySelectorAll('#scopes button').forEach((button) => button.addEventListener('click', () => {
      activeScope = button.dataset.scope;
      document.querySelectorAll('#scopes button').forEach((item) => item.classList.toggle('active', item === button));
      render();
    }));
    render();
  </script>
</body>
</html>
