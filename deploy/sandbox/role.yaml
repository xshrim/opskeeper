# The sandbox runner does not receive Kubernetes API credentials. If a future
# worker needs to observe its own Job status, bind that worker to a separate,
# namespace-scoped role; never widen this ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opskeeper-sandbox-noop
  namespace: opskeeper
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opskeeper-operation-runner
  namespace: opskeeper
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opskeeper-operation-runner
  namespace: opskeeper
subjects:
  - kind: ServiceAccount
    name: opskeeper-operation-runner
    namespace: opskeeper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opskeeper-operation-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opskeeper-operation-submitter
  namespace: opskeeper
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opskeeper-operation-submitter
  namespace: opskeeper
subjects:
  - kind: ServiceAccount
    name: opskeeper
    namespace: opskeeper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opskeeper-operation-submitter
