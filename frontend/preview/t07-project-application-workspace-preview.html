<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>T07 项目与应用工作台 · 八种设计方案预览</title>
    <style>
      :root {
        --ink: #202a30;
        --muted: #68757b;
        --subtle: #93a0a4;
        --accent: #d9642a;
        --accent-strong: #ba4f1d;
        --accent-soft: #fff0e7;
        --teal: #168c78;
        --teal-soft: #e5f5f0;
        --blue: #3979b9;
        --blue-soft: #eaf2fb;
        --yellow: #a8781f;
        --yellow-soft: #fff5dc;
        --danger: #b64c46;
        --danger-soft: #fbeceb;
        --surface: #ffffff;
        --surface-2: #fbfaf8;
        --wash: #f0ece8;
        --line: #e3dcd5;
        --line-strong: #cfc2b8;
        --sidebar: #1d252a;
        --sidebar-2: #2a343a;

        --shadow: 0 14px 35px rgba(39, 32, 27, .08);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);

        text-rendering: optimizeLegibility;
      }
      :root[data-theme="dark"] {
        --ink: #e8eeed;
        --muted: #aab8b7;
        --subtle: #768b89;
        --accent: #ef8a51;
        --accent-strong: #ff9b62;
        --accent-soft: #432b21;
        --teal: #57c6ad;
        --teal-soft: #173f3a;
        --blue: #80b4ec;
        --blue-soft: #1c344e;
        --yellow: #e1be6f;
        --yellow-soft: #463a1e;
        --danger: #f0988f;
        --danger-soft: #492b2b;
        --surface: #1d272a;
        --surface-2: #243033;
        --wash: #111a1c;
        --line: #354447;
        --line-strong: #526565;
        --sidebar: #0d1416;
        --sidebar-2: #18312f;
        --sidebar-text: #e7efed;
        --shadow: 0 14px 35px rgba(0, 0, 0, .24);
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; background: var(--wash); }
      button, input, select { font: inherit; }
      button { cursor: pointer; }
      button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 28%, transparent); outline-offset: 2px; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
      .shell { display: grid; grid-template-columns: 224px minmax(0, 1fr); min-height: 100vh; }
      .sidebar { display: flex; flex-direction: column; min-height: 100vh; padding: 22px 14px 17px; color: var(--sidebar-text); background: var(--sidebar); border-right: 1px solid #344047; }
      .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
      .brand-mark { display: grid; place-items: center; width: 30px; height: 30px; color: #fff; background: var(--accent); border-radius: 7px; font-weight: 850; }
      .brand strong { display: block; font-size: 15px; }
      .brand small { display: block; margin-top: 2px; color: #849198; font-size: 10px; }
      .nav-label { margin: 31px 8px 9px; color: #7e8a91; font-size: 10px; font-weight: 800; letter-spacing: .13em; }
      .side-nav { display: grid; gap: 3px; }
      .side-nav button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 39px; padding: 0 11px; color: #adb8bc; background: transparent; border: 0; border-radius: 6px; text-align: left; font-size: 12px; }
      .side-nav button:hover, .side-nav button.active { color: #fff; background: var(--sidebar-2); }
      .side-nav button.active::before { width: 3px; height: 18px; margin-left: -11px; margin-right: 5px; border-radius: 0 3px 3px 0; background: var(--accent); content: ""; }
      .side-nav b { width: 17px; color: currentColor; text-align: center; font-size: 15px; font-weight: 500; }
      .sidebar-foot { display: flex; align-items: center; gap: 8px; margin-top: auto; padding: 14px 8px 0; color: #8d9a9e; border-top: 1px solid #344047; font-size: 11px; }
      .avatar { display: grid; place-items: center; width: 27px; height: 27px; color: var(--ink); background: var(--accent-soft); border-radius: 50%; font-size: 10px; font-weight: 800; }
      .page { min-width: 0; }
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 72px; padding: 14px clamp(18px, 4vw, 54px); background: var(--surface); border-bottom: 1px solid var(--line); }
      .breadcrumb { color: var(--muted); font-size: 11px; }
      .breadcrumb strong { display: block; margin-top: 4px; color: var(--ink); font-size: 16px; }
      .top-actions { display: flex; align-items: center; gap: 8px; }
      .top-actions small { color: var(--subtle); font-size: 10px; }
      .control, .button, .icon-button, .select { min-height: 33px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
      .control, .button { padding: 0 11px; font-size: 11px; }
      .button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 650; }
      .button:hover, .control:hover, .icon-button:hover, .select:hover { color: var(--accent); border-color: var(--accent); }
      .button.primary { color: #fff; background: var(--accent); border-color: var(--accent); }
      .button.primary:hover { color: #fff; background: var(--accent-strong); }
      .icon-button { display: inline-grid; place-items: center; width: 33px; padding: 0; font-size: 16px; }
      main { width: min(1430px, calc(100% - 36px)); margin: 0 auto; padding: 30px 0 55px; }
      .intro { display: flex; align-items: end; justify-content: space-between; gap: 22px; margin-bottom: 18px; }
      .eyebrow { margin: 0 0 8px; color: var(--accent); font-size: 10px; font-weight: 850; letter-spacing: .14em; }
      h1, h2, h3, h4, p { letter-spacing: 0; }
      h1 { margin: 0; font-size: 29px; line-height: 1.16; }
      h2 { margin: 0; font-size: 17px; }
      h3 { margin: 0; font-size: 14px; }
      h4 { margin: 0; font-size: 12px; }
      .intro p:not(.eyebrow) { max-width: 820px; margin: 9px 0 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
      .preview-control { display: grid; gap: 5px; min-width: 180px; color: var(--muted); font-size: 10px; }
      .select { min-height: 35px; padding: 0 9px; font-size: 11px; }
      .scheme-tabs { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 7px; margin-bottom: 15px; }
      .scheme-tab { min-height: 78px; padding: 10px 10px; color: var(--muted); background: color-mix(in srgb, var(--surface) 70%, transparent); border: 1px solid transparent; border-radius: 7px; text-align: left; }
      .scheme-tab:hover { border-color: color-mix(in srgb, var(--accent) 54%, var(--line)); }
      .scheme-tab[aria-selected="true"] { color: var(--ink); background: var(--surface); border-color: var(--accent); box-shadow: var(--shadow); }
      .scheme-tab b, .scheme-tab strong, .scheme-tab span { display: block; }
      .scheme-tab b { color: var(--accent); font-size: 10px; }
      .scheme-tab strong { margin-top: 5px; font-size: 12px; }
      .scheme-tab span { margin-top: 5px; font-size: 10px; line-height: 1.35; }
      .design-note { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(280px, .7fr); gap: 20px; margin-bottom: 15px; padding: 15px 18px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 7px; }
      .design-note h3 { font-size: 13px; }
      .design-note p { margin: 6px 0 0; color: var(--muted); font-size: 11px; line-height: 1.55; }
      .principles { display: grid; align-content: center; gap: 6px; color: var(--muted); font-size: 10px; }
      .principles span { display: flex; align-items: center; gap: 7px; }
      .principles i { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); }
      .principles b { color: var(--ink); }
      .workspace { min-width: 0; }
      .workspace-shell { min-width: 0; overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
      .project-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 18px 20px; border-bottom: 1px solid var(--line); }
      .project-identity { display: flex; align-items: center; gap: 12px; min-width: 0; }
      .project-mark { display: grid; place-items: center; flex: 0 0 auto; width: 42px; height: 42px; color: var(--accent-strong); background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--line)); border-radius: 9px; font-size: 20px; }
      .project-identity strong, .project-identity small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .project-identity strong { font-size: 17px; }
      .project-identity small { margin-top: 4px; color: var(--muted); font-size: 10px; }
      .head-actions { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; justify-content: end; }
      .stat-strip { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
      .stat { min-height: 89px; padding: 15px 17px; border-right: 1px solid var(--line); }
      .stat:last-child { border-right: 0; }
      .stat label, .stat small { display: block; color: var(--muted); font-size: 10px; }
      .stat strong { display: block; margin-top: 8px; font-size: 23px; line-height: 1; }
      .stat em { display: block; margin-top: 7px; color: var(--teal); font-size: 10px; font-style: normal; }
      .stat em.warn { color: var(--yellow); }
      .body-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(310px, .8fr); gap: 14px; padding: 15px; background: var(--surface-2); }
      .panel { min-width: 0; padding: 15px; background: var(--surface); border: 1px solid var(--line); border-radius: 7px; }
      .panel-heading { display: flex; align-items: start; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
      .panel-heading p { margin: 4px 0 0; color: var(--muted); font-size: 10px; }
      .panel-heading .count { color: var(--subtle); font-size: 10px; }
      .section-actions { display: flex; align-items: center; gap: 5px; }
      .mini-button { min-height: 26px; padding: 0 8px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 5px; font-size: 10px; }
      .mini-button:hover { color: var(--accent); border-color: var(--accent); }
      .app-list, .resource-list, .dependency-list { display: grid; gap: 6px; }
      .app-row, .resource-row, .dependency-row { display: grid; align-items: center; gap: 10px; min-width: 0; padding: 10px; border: 1px solid var(--line); border-radius: 6px; }
      .app-row { grid-template-columns: 31px minmax(130px, 1fr) auto auto auto; }
      .resource-row { grid-template-columns: 27px minmax(130px, 1fr) 80px auto; }
      .dependency-row { grid-template-columns: 27px minmax(0, 1fr) auto; }
      .app-row:hover, .resource-row:hover, .dependency-row:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); background: color-mix(in srgb, var(--accent-soft) 35%, var(--surface)); }
      .entity-icon { display: grid; place-items: center; width: 27px; height: 27px; color: var(--teal); background: var(--teal-soft); border: 1px solid color-mix(in srgb, var(--teal) 22%, var(--line)); border-radius: 6px; font-size: 14px; }
      .entity-icon.app { color: var(--accent-strong); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 24%, var(--line)); }
      .entity-icon.db { color: var(--blue); background: var(--blue-soft); border-color: color-mix(in srgb, var(--blue) 24%, var(--line)); }
      .entity-icon.warn { color: var(--yellow); background: var(--yellow-soft); border-color: color-mix(in srgb, var(--yellow) 24%, var(--line)); }
      .entity-copy { min-width: 0; }
      .entity-copy strong, .entity-copy small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .entity-copy strong { font-size: 12px; }
      .entity-copy small { margin-top: 4px; color: var(--muted); font-size: 10px; }
      .status { display: inline-flex; align-items: center; gap: 5px; color: var(--teal); font-size: 10px; white-space: nowrap; }
      .status.warn { color: var(--yellow); }
      .status.bad { color: var(--danger); }
      .status i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
      .tag { display: inline-flex; align-items: center; min-height: 21px; padding: 0 6px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; font-size: 9px; white-space: nowrap; }
      .tag.teal { color: var(--teal); background: var(--teal-soft); border-color: color-mix(in srgb, var(--teal) 25%, var(--line)); }
      .tag.blue { color: var(--blue); background: var(--blue-soft); border-color: color-mix(in srgb, var(--blue) 25%, var(--line)); }
      .tag.warn { color: var(--yellow); background: var(--yellow-soft); border-color: color-mix(in srgb, var(--yellow) 25%, var(--line)); }
      .row-end { display: flex; align-items: center; justify-content: end; gap: 7px; }
      .progress { height: 5px; overflow: hidden; margin-top: 7px; background: var(--line); border-radius: 4px; }
      .progress span { display: block; height: 100%; background: var(--teal); border-radius: inherit; }
      .progress span.warn { background: var(--yellow); }
      .topology { position: relative; min-height: 276px; overflow: hidden; background: radial-gradient(circle at 35% 20%, color-mix(in srgb, var(--accent-soft) 70%, transparent), transparent 45%), var(--surface-2); border: 1px solid var(--line); border-radius: 6px; }
      .topology::before, .topology::after { position: absolute; background: var(--line-strong); content: ""; }
      .topology::before { top: 50%; left: 17%; width: 66%; height: 1px; transform: rotate(-16deg); }
      .topology::after { top: 49%; left: 17%; width: 66%; height: 1px; transform: rotate(16deg); }
      .node { position: absolute; z-index: 1; display: grid; place-items: center; width: 104px; min-height: 55px; padding: 7px; color: var(--ink); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 7px; box-shadow: 0 5px 13px rgba(39, 32, 27, .07); text-align: center; }
      .node strong, .node small { display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .node strong { font-size: 10px; }
      .node small { margin-top: 4px; color: var(--muted); font-size: 9px; }
      .node.app { top: 42%; left: calc(50% - 52px); color: var(--accent-strong); background: var(--accent-soft); border-color: var(--accent); }
      .node.host { top: 9%; left: 7%; }
      .node.kube { top: 10%; right: 7%; }
      .node.kafka { bottom: 9%; left: 7%; }
      .node.pg { right: 7%; bottom: 9%; }
      .topology-legend { position: absolute; right: 9px; bottom: 8px; display: flex; gap: 8px; color: var(--muted); font-size: 9px; }
      .topology-legend span { display: inline-flex; align-items: center; gap: 4px; }
      .topology-legend i { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); }
      .topology-legend i.app-dot { background: var(--accent); }
      .topology-legend i.dep-dot { background: var(--blue); }
      .notice { display: none; position: fixed; z-index: 20; right: 22px; bottom: 22px; max-width: 320px; padding: 11px 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--line-strong); border-left: 3px solid var(--teal); border-radius: 6px; box-shadow: var(--shadow); font-size: 11px; }
      .notice.show { display: block; animation: appear 160ms ease-out; }
      @keyframes appear { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
      .footer-note { margin: 15px 0 0; color: var(--muted); font-size: 11px; line-height: 1.5; }

      /* Variants keep the same information architecture while changing the primary scan path. */
      .variant-b .workspace-shell { background: #e8e6e0; }
      .variant-b .project-head { background: var(--surface); }
      .variant-b .body-grid { grid-template-columns: minmax(0, 1fr); background: transparent; }
      .variant-b .body-grid > .panel:first-child { order: 2; }
      .variant-b .topology { min-height: 355px; background: radial-gradient(circle at center, color-mix(in srgb, var(--teal-soft) 55%, transparent), transparent 42%), var(--surface); }
      .variant-b .node.app { top: 43%; }
      .variant-b .node.host { top: 14%; left: 17%; }
      .variant-b .node.kube { top: 14%; right: 17%; }
      .variant-b .node.kafka { bottom: 12%; left: 17%; }
      .variant-b .node.pg { right: 17%; bottom: 12%; }
      .variant-c .stat-strip { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .variant-c .stat:last-child { display: none; }
      .variant-c .body-grid { grid-template-columns: minmax(0, 1fr); }
      .variant-c .panel { padding: 0; border: 0; }
      .variant-c .panel-heading { padding: 14px 15px 0; }
      .variant-c .app-list { gap: 0; }
      .variant-c .app-row { grid-template-columns: 31px minmax(0, 1.3fr) minmax(105px, .7fr) minmax(100px, .6fr) auto; border-width: 1px 0 0; border-radius: 0; }
      .variant-c .resource-list { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 0 15px 15px; }
      .variant-d .body-grid { grid-template-columns: minmax(0, 1fr); }
      .variant-d .app-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .variant-d .app-row { grid-template-columns: 36px minmax(0, 1fr); align-items: start; min-height: 142px; padding: 13px; }
      .variant-d .app-row .row-end, .variant-d .app-row > .status { grid-column: 2; justify-content: start; }
      .variant-d .app-row .entity-icon { width: 35px; height: 35px; font-size: 17px; }
      .variant-d .resource-list { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .variant-e .project-head { background: linear-gradient(90deg, var(--surface), var(--accent-soft)); }
      .variant-e .body-grid { grid-template-columns: 265px minmax(0, 1fr); align-items: start; }
      .variant-e .body-grid > .panel:first-child { grid-column: 2; grid-row: 1 / span 2; }
      .variant-e .body-grid > .panel:nth-child(2) { grid-column: 1; grid-row: 1; }
      .variant-e .body-grid > .panel:nth-child(3) { grid-column: 1; grid-row: 2; }
      .variant-e .body-grid > .panel:first-child .app-list { gap: 8px; }
      .variant-e .body-grid > .panel:first-child .app-row { grid-template-columns: 31px minmax(0, 1fr) auto; }
      .variant-f .project-head { border-bottom: 0; }
      .variant-f .stat-strip { background: var(--sidebar); color: var(--sidebar-text); border: 0; }
      .variant-f .stat { border-color: #344047; }
      .variant-f .stat label, .variant-f .stat small { color: #9ba9ac; }
      .variant-f .body-grid { grid-template-columns: minmax(0, .75fr) minmax(0, 1.25fr); }
      .variant-f .body-grid > .panel:nth-child(2) { grid-column: 2; grid-row: 1 / span 2; }
      .variant-f .body-grid > .panel:first-child { grid-column: 1; grid-row: 1; }
      .variant-f .body-grid > .panel:nth-child(3) { grid-column: 1; grid-row: 2; }
      .variant-f .topology { min-height: 474px; }
      .variant-f .node { width: 118px; min-height: 61px; }
      .variant-g .workspace-shell { border-radius: 0; box-shadow: none; }
      .variant-g .project-head { align-items: start; padding: 23px 24px; background: var(--sidebar); color: #fff; border: 0; }
      .variant-g .project-identity small { color: #a9b7ba; }
      .variant-g .project-mark { color: var(--accent); background: #fff; border: 0; }
      .variant-g .body-grid { grid-template-columns: minmax(0, 1fr); padding: 20px; background: var(--surface); }
      .variant-g .stat-strip { border-bottom: 0; padding: 14px 20px 0; background: var(--surface); }
      .variant-g .stat { min-height: 78px; padding: 13px; background: var(--surface-2); border: 1px solid var(--line); border-right: 0; }
      .variant-g .stat:first-child { border-radius: 6px 0 0 6px; }
      .variant-g .stat:last-child { border-right: 1px solid var(--line); border-radius: 0 6px 6px 0; }
      .variant-g .body-grid > .panel:first-child { order: 0; }
      .variant-g .app-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .variant-g .panel { padding: 17px; }
      .variant-g .panel-heading { align-items: center; }
      .variant-g .panel-heading::before { width: 4px; height: 17px; margin-right: -4px; border-radius: 3px; background: var(--accent); content: ""; }
      .variant-h { --accent: #4a72b8; --accent-strong: #345994; --accent-soft: #eaf0fc; --teal: #2d9b86; --teal-soft: #e7f5f1; }
      :root[data-theme="dark"] .variant-h { --accent: #8eb6f3; --accent-strong: #a6c7fa; --accent-soft: #233550; --teal: #67d0b6; --teal-soft: #173e38; }
      .variant-h .workspace-shell { border-radius: 16px; }
      .variant-h .project-head { padding: 22px 24px; }
      .variant-h .project-mark, .variant-h .entity-icon { border-radius: 12px; }
      .variant-h .body-grid { gap: 18px; padding: 18px; }
      .variant-h .panel { padding: 17px; border-radius: 12px; }

      @media (max-width: 1120px) {
        .scheme-tabs { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .body-grid, .variant-e .body-grid, .variant-f .body-grid { grid-template-columns: minmax(0, 1fr); }
        .variant-e .body-grid > .panel:first-child, .variant-e .body-grid > .panel:nth-child(2), .variant-e .body-grid > .panel:nth-child(3), .variant-f .body-grid > .panel:first-child, .variant-f .body-grid > .panel:nth-child(2), .variant-f .body-grid > .panel:nth-child(3) { grid-column: auto; grid-row: auto; }

      @media (max-width: 760px) {
        .shell { grid-template-columns: 64px minmax(0, 1fr); }
        .sidebar { padding: 18px 10px; }
        .brand { justify-content: center; padding: 0; }
        .brand > div:last-child, .nav-label, .side-nav button span, .sidebar-foot span { display: none; }
        .side-nav button { justify-content: center; padding: 0; }
        .side-nav button.active::before { display: none; }
        main { width: min(100% - 24px, 1430px); padding-top: 23px; }
        .topbar { align-items: flex-start; }
        .top-actions small { display: none; }
        .intro, .design-note { display: grid; grid-template-columns: 1fr; align-items: start; }
        .scheme-tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .stat-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .stat { border-bottom: 1px solid var(--line); }
        .stat:nth-child(2n) { border-right: 0; }
        .stat:last-child { display: block; }
        .project-head { align-items: start; flex-direction: column; }
        .head-actions { justify-content: start; }
        .body-grid { padding: 10px; }
        .app-row, .resource-row, .dependency-row { grid-template-columns: 29px minmax(0, 1fr) auto; }
        .app-row > .tag, .resource-row > .tag, .resource-row > .status, .app-row > .status { display: none; }
        .row-end { flex-direction: column; align-items: end; gap: 3px; }
        .variant-c .app-row { grid-template-columns: 29px minmax(0, 1fr) auto; }
        .variant-c .app-row > *:nth-child(3), .variant-c .app-row > *:nth-child(4) { display: none; }
        .variant-c .resource-list, .variant-d .app-list, .variant-d .resource-list, .variant-g .app-list { grid-template-columns: 1fr; }
        .variant-c .resource-row { grid-template-columns: 27px minmax(0, 1fr) auto; }
        .variant-c .resource-row > .tag, .variant-c .resource-row > .status { display: inline-flex; }
        .topology { min-height: 345px; }
        .node { width: 89px; }
        .node.host { left: 2%; }
        .node.kube { right: 2%; }
        .node.kafka { left: 2%; }
        .node.pg { right: 2%; }
      }
      @media (max-width: 450px) {
        h1 { font-size: 24px; }
        .scheme-tabs { grid-template-columns: 1fr; }
        .stat strong { font-size: 20px; }
        .top-actions .button.primary { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand"><div class="brand-mark">O</div><div><strong>OpsKeeper</strong><small>智能值守平台</small></div></div>
        <div class="nav-label">WORKSPACE</div>
        <nav class="side-nav" aria-label="主导航">
          <button type="button"><b>⌂</b><span>总览</span></button>
          <button type="button" class="active"><b>▦</b><span>项目</span></button>
          <button type="button"><b>◇</b><span>资源</span></button>
          <button type="button"><b>⌁</b><span>集群导入</span></button>
          <button type="button"><b>✦</b><span>模型与 Skill</span></button>
        </nav>
        <div class="sidebar-foot"><div class="avatar">林</div><span>林晓 · 平台管理员</span></div>
      </aside>
      <div class="page">
        <header class="topbar">
          <div class="breadcrumb"><span>平台 / 团队支付 / 项目</span><strong>项目工作台</strong></div>
          <div class="top-actions"><small>静态预览 · 不接入 API</small><button class="control" id="theme-toggle" type="button">◐ <span>深色</span></button><button class="button primary" type="button" data-action="add-project">＋ 添加项目</button></div>
        </header>
        <main>
          <div class="intro">
            <div><p class="eyebrow">DESIGN REVIEW / T07</p><h1>项目与应用工作台</h1><p>八种页面方案，围绕项目汇总资源状态、应用实例、依赖关系和拓扑，并把“添加 / 导入 / 诊断”放在同一条工作路径上。</p></div>
            <label class="preview-control">当前项目<select class="select" id="project-select"><option>支付结算 · PAYMENTS</option><option>用户中心 · IDENTITY</option><option>营销平台 · GROWTH</option></select></label>
          </div>
          <div class="scheme-tabs" role="tablist" aria-label="项目工作台设计方案">
            <button class="scheme-tab" type="button" role="tab" aria-selected="true" data-variant="a"><b>A</b><strong>指挥台</strong><span>状态优先 / 快速处置</span></button>
            <button class="scheme-tab" type="button" role="tab" aria-selected="false" data-variant="b"><b>B</b><strong>拓扑画布</strong><span>依赖优先 / 关系清晰</span></button>
            <button class="scheme-tab" type="button" role="tab" aria-selected="false" data-variant="c"><b>C</b><strong>运营表格</strong><span>高密度 / 批量管理</span></button>
            <button class="scheme-tab" type="button" role="tab" aria-selected="false" data-variant="d"><b>D</b><strong>应用目录</strong><span>应用优先 / 入口直观</span></button>
            <button class="scheme-tab" type="button" role="tab" aria-selected="false" data-variant="e"><b>E</b><strong>项目驾驶舱</strong><span>侧栏导航 / 分区稳定</span></button>
            <button class="scheme-tab" type="button" role="tab" aria-selected="false" data-variant="f"><b>F</b><strong>依赖中心</strong><span>风险优先 / 拓扑聚焦</span></button>
            <button class="scheme-tab" type="button" role="tab" aria-selected="false" data-variant="g"><b>G</b><strong>引导式工作台</strong><span>新项目 / 分步进入</span></button>
            <button class="scheme-tab" type="button" role="tab" aria-selected="false" data-variant="h"><b>H</b><strong>服务目录</strong><span>柔和卡片 / 业务视角</span></button>
          </div>
          <section class="design-note" id="design-note" aria-live="polite"></section>
          <section class="workspace" id="workspace" aria-label="项目工作台方案预览"></section>
          <p class="footer-note">所有数据仅用于静态设计预览。按钮只触发展示反馈，不发送请求；最终方案确认后，再接入项目、应用、资源绑定、导入和 AI 诊断 API。</p>
        </main>
      </div>
    </div>
    <div class="notice" id="notice" role="status"></div>
    <script>
      const variants = {
        a: { title: '指挥台', summary: '把当前项目的健康度放在第一视觉层，应用列表承担日常处置入口，拓扑作为右侧确认面。', bullets: ['项目是工作台，不是连接资源表单', '应用健康与资源连接状态分开显示', '诊断入口固定在项目与应用标题栏'] },
        b: { title: '拓扑画布', summary: '适合依赖复杂、需要快速判断影响面的团队。拓扑先回答“谁依赖谁”，列表再承接操作。', bullets: ['中央节点固定为当前项目应用', '关系边只展示已确认的绑定', '依赖异常可直接进入诊断'] },
        c: { title: '运营表格', summary: '适合资源和应用数量较多的项目。表格支持扫描、排序和批量操作，拓扑作为辅助面板。', bullets: ['状态、实例数、依赖数同列对齐', '减少卡片留白，提高信息密度', '保留导入和批量配置入口'] },
        d: { title: '应用目录', summary: '以应用为主角，适合开发和业务团队。每张卡片都能看到实例、依赖风险和 AI 诊断入口。', bullets: ['应用不是普通资源卡片', '应用卡片显示运行方式和实例数', '资源区域只承担共享依赖查找'] },
        e: { title: '项目驾驶舱', summary: '采用稳定的项目侧栏与主工作区，适合项目长期运营和多个子视图之间频繁切换。', bullets: ['项目级导航统一承载应用、资源和拓扑', '主工作区一次聚焦一个任务', '适合后续扩展巡检和变更记录'] },
        f: { title: '依赖中心', summary: '将依赖与风险置于核心位置，适合微服务较多、资源故障需要快速追溯的运维团队。', bullets: ['拓扑面积最大，便于看影响范围', '异常依赖使用明确的警示色', '应用与资源仍保持独立身份'] },
        g: { title: '引导式工作台', summary: '适合新建或导入项目。顶部给出阶段进度，下方把应用、资源和依赖配置拆成可完成的任务。', bullets: ['新项目先建立边界，再补充关联', '导入项目与导入应用是同级入口', '每一步都能跳转到 AI 诊断验证'] },
        h: { title: '服务目录', summary: '更柔和的服务目录风格，适合业务负责人浏览应用全貌，同时保留运维所需的状态和依赖细节。', bullets: ['业务名称优先，技术信息作为副信息', '卡片圆角仅用于重复实体', '状态和诊断按钮保持清晰对比'] }
      };

      const appRows = [
        { name: '支付 API', code: 'payments-api', mode: '云原生', instances: '6 实例', status: 'healthy', detail: 'Kubernetes · payment-prod', icon: '◇' },
        { name: '对账 Worker', code: 'settlement-worker', mode: '容器化', instances: '3 实例', status: 'warn', detail: 'Docker · worker-settlement', icon: '▣' },
        { name: '收银台', code: 'checkout-web', mode: '虚拟机', instances: '2 实例', status: 'healthy', detail: 'Host · checkout-*', icon: '⌂' }
      ];
      const resources = [
        { name: 'payment-prod', kind: 'Kubernetes', note: '云原生运行时 · 6 workloads', icon: '◇', tone: 'teal', status: '已连接' },
        { name: 'redis-orders', kind: 'Redis', note: '缓存 · DB 2 · key: order:*', icon: '◈', tone: 'blue', status: '已连接' },
        { name: 'kafka-payments', kind: 'Kafka', note: '消息 · topic: payment-events', icon: '≋', tone: 'warn', status: '延迟' },
        { name: 'ledger-postgres', kind: 'PostgreSQL', note: '数据库 · schema: ledger', icon: '▤', tone: 'blue', status: '已连接' }
      ];

      function statusLabel(status) {
        return status === 'healthy' ? '<span class="status"><i></i>运行正常</span>' : '<span class="status warn"><i></i>需要关注</span>';
      }
      function appRow(app, compact = false) {
        return `<article class="app-row"><span class="entity-icon app">${app.icon}</span><span class="entity-copy"><strong>${app.name}</strong><small>${app.code} · ${app.detail}</small></span>${compact ? '' : `<span class="tag">${app.mode}</span>`}<span class="row-end">${statusLabel(app.status)}<small class="muted">${app.instances}</small></span><button class="mini-button" type="button" data-action="diagnose" data-name="${app.name}">诊断 ↗</button></article>`;
      }
      function resourceRow(resource) {
        return `<article class="resource-row"><span class="entity-icon ${resource.tone === 'blue' ? 'db' : resource.tone === 'warn' ? 'warn' : ''}">${resource.icon}</span><span class="entity-copy"><strong>${resource.name}</strong><small>${resource.kind} · ${resource.note}</small></span><span class="tag ${resource.tone}">${resource.status}</span><button class="mini-button" type="button" data-action="resource" data-name="${resource.name}">查看</button></article>`;
      }
      function topology() {
        return `<div class="topology" aria-label="应用依赖拓扑"><div class="node host"><strong>checkout-web</strong><small>Host · 2 instances</small></div><div class="node kube"><strong>payment-prod</strong><small>Kubernetes</small></div><div class="node app"><strong>支付 API</strong><small>Application</small></div><div class="node kafka"><strong>kafka-payments</strong><small>topic · payment-events</small></div><div class="node pg"><strong>ledger-postgres</strong><small>schema · ledger</small></div><div class="topology-legend"><span><i class="app-dot"></i>应用</span><span><i></i>运行时</span><span><i class="dep-dot"></i>依赖</span></div></div>`;
      }
      function stats() {
        return `<div class="stat-strip"><div class="stat"><label>应用</label><strong>3</strong><em>全部已登记</em></div><div class="stat"><label>运行实例</label><strong>11</strong><em>10 正常 · 1 关注</em></div><div class="stat"><label>关联资源</label><strong>8</strong><em>5 连接正常</em></div><div class="stat"><label>依赖关系</label><strong>14</strong><em class="warn">2 条需要关注</em></div><div class="stat"><label>最近诊断</label><strong>12m</strong><em>支付 API · 已完成</em></div></div>`;
      }
      function appPanel(options = {}) {
        const compact = options.compact || false;
        return `<section class="panel"><div class="panel-heading"><div><h3>应用</h3><p>${compact ? '项目内 3 个业务应用' : '运行实例、状态与诊断入口'}</p></div><div class="section-actions"><span class="count">3 个</span><button class="mini-button" type="button" data-action="add-app">＋ 添加</button><button class="mini-button" type="button" data-action="import-app">⇩ 导入</button></div></div><div class="app-list">${appRows.map((app) => appRow(app, compact)).join('')}</div></section>`;
      }
      function resourcePanel() {
        return `<section class="panel"><div class="panel-heading"><div><h3>关联资源</h3><p>底层运行时与依赖目标</p></div><div class="section-actions"><span class="count">8 个</span><button class="mini-button" type="button" data-action="bind">＋ 关联</button></div></div><div class="resource-list">${resources.map(resourceRow).join('')}</div></section>`;
      }
      function dependencyPanel() {
        return `<section class="panel"><div class="panel-heading"><div><h3>依赖摘要</h3><p>按绑定字段固定查询范围</p></div><button class="mini-button" type="button" data-action="topology">查看拓扑 ↗</button></div><div class="dependency-list"><article class="dependency-row"><span class="entity-icon db">≋</span><span class="entity-copy"><strong>kafka-payments</strong><small>topic · payment-events · 3 个应用使用</small></span><span class="status warn"><i></i>延迟</span></article><article class="dependency-row"><span class="entity-icon db">▤</span><span class="entity-copy"><strong>ledger-postgres</strong><small>schema · ledger · 读写正常</small></span><span class="status"><i></i>正常</span></article><article class="dependency-row"><span class="entity-icon db">◈</span><span class="entity-copy"><strong>redis-orders</strong><small>DB 2 · key order:* · 命中率 96%</small></span><span class="status"><i></i>正常</span></article></div></section>`;
      }
      function projectHead() {
        return `<div class="project-head"><div class="project-identity"><span class="project-mark">▦</span><span><strong>支付结算</strong><small>PAYMENTS · 团队支付 · 项目级 · 最近更新 6 分钟前</small></span></div><div class="head-actions"><button class="button" type="button" data-action="import-project">⇩ 导入项目</button><button class="button" type="button" data-action="diagnose-project">✦ AI 诊断</button><button class="button primary" type="button" data-action="add-app">＋ 添加应用</button></div></div>`;
      }
      function render(variant) {
        const root = document.getElementById('workspace');
        root.className = `workspace variant-${variant}`;
        const common = `${projectHead()}${stats()}`;
        let body = '';
        if (variant === 'a') body = `<div class="body-grid">${appPanel()}<div class="panel">${topology()}</div>${resourcePanel()}</div>`;
        if (variant === 'b') body = `<div class="body-grid"><div class="panel"><div class="panel-heading"><div><h3>项目拓扑</h3><p>点击节点可查看绑定与诊断入口</p></div><button class="mini-button" type="button" data-action="topology">筛选关系</button></div>${topology()}</div>${appPanel({ compact: true })}${resourcePanel()}</div>`;
        if (variant === 'c') body = `<div class="body-grid">${appPanel()}${resourcePanel()}${dependencyPanel()}</div>`;
        if (variant === 'd') body = `<div class="body-grid">${appPanel()}<div class="panel"><div class="panel-heading"><div><h3>项目依赖</h3><p>共享资源与绑定字段</p></div><button class="mini-button" type="button" data-action="bind">＋ 关联资源</button></div><div class="resource-list">${resources.map(resourceRow).join('')}</div></div></div>`;
        if (variant === 'e') body = `<div class="body-grid">${appPanel()}${resourcePanel()}${dependencyPanel()}</div>`;
        if (variant === 'f') body = `<div class="body-grid">${appPanel({ compact: true })}<div class="panel"><div class="panel-heading"><div><h3>依赖拓扑</h3><p>2 条异常边 · 4 个直接依赖</p></div><button class="mini-button" type="button" data-action="diagnose-project">✦ 诊断影响面</button></div>${topology()}</div>${dependencyPanel()}</div>`;
        if (variant === 'g') body = `<div class="body-grid"><section class="panel"><div class="panel-heading"><div><h3>项目配置进度</h3><p>完成基础配置后即可开始 AI 诊断</p></div><span class="tag teal">4 / 5 完成</span></div><div class="dependency-list"><article class="dependency-row"><span class="entity-icon app">✓</span><span class="entity-copy"><strong>项目边界</strong><small>支付结算 · PAYMENTS · 已完成</small></span><span class="status"><i></i>完成</span></article><article class="dependency-row"><span class="entity-icon app">✓</span><span class="entity-copy"><strong>应用目录</strong><small>已添加 3 个应用，可继续导入</small></span><span class="status"><i></i>完成</span></article><article class="dependency-row"><span class="entity-icon warn">2</span><span class="entity-copy"><strong>资源关联</strong><small>还有 2 条依赖需要补充绑定字段</small></span><span class="status warn"><i></i>待处理</span></article><article class="dependency-row"><span class="entity-icon">✦</span><span class="entity-copy"><strong>开始 AI 诊断</strong><small>选择一个应用或从项目全局开始</small></span><button class="mini-button" type="button" data-action="diagnose-project">进入 ↗</button></article></div></section>${appPanel()}${resourcePanel()}</div>`;
        if (variant === 'h') body = `<div class="body-grid">${appPanel()}<div class="panel"><div class="panel-heading"><div><h3>依赖与资源</h3><p>按业务角色分组</p></div><button class="mini-button" type="button" data-action="bind">＋ 添加关联</button></div><div class="resource-list">${resources.map(resourceRow).join('')}</div></div><div class="panel"><div class="panel-heading"><div><h3>关系视图</h3><p>应用与基础设施之间的已确认关系</p></div></div>${topology()}</div></div>`;
        root.innerHTML = `<div class="workspace-shell">${common}${body}</div>`;
        const meta = variants[variant];
        document.getElementById('design-note').innerHTML = `<div><h3>${variant.toUpperCase()} · ${meta.title}</h3><p>${meta.summary}</p></div><div class="principles">${meta.bullets.map((item) => `<span><i></i><b>${item}</b></span>`).join('')}</div>`;
      }
      function notice(message) {
        const node = document.getElementById('notice');
        node.textContent = message;
        node.classList.add('show');
        window.clearTimeout(notice.timer);
        notice.timer = window.setTimeout(() => node.classList.remove('show'), 2200);
      }
      document.querySelectorAll('.scheme-tab').forEach((tab) => tab.addEventListener('click', () => {
        document.querySelectorAll('.scheme-tab').forEach((item) => item.setAttribute('aria-selected', String(item === tab)));
        render(tab.dataset.variant);
      }));
      document.getElementById('theme-toggle').addEventListener('click', () => {
        const dark = document.documentElement.dataset.theme === 'dark';
        document.documentElement.dataset.theme = dark ? 'light' : 'dark';
        document.querySelector('#theme-toggle span').textContent = dark ? '深色' : '浅色';
      });
      document.getElementById('project-select').addEventListener('change', (event) => notice(`已切换到项目“${event.target.value.split(' · ')[0]}”`));
      document.addEventListener('click', (event) => {
        const action = event.target.closest('[data-action]');
        if (!action) return;
        const messages = {
          'add-project': '打开“添加项目”流程', 'add-app': '打开“添加应用”流程', 'import-project': '打开项目导入流程', 'import-app': '打开应用导入流程',
          bind: '打开资源关联配置', topology: '拓扑关系筛选已展开', 'diagnose-project': '正在准备项目级 AI 诊断', diagnose: `正在准备“${action.dataset.name || '应用'}”的 AI 诊断`, resource: `打开资源“${action.dataset.name || ''}”详情`
        };
        notice(messages[action.dataset.action] || '操作已触发');
      });
      render('a');
    </script>
  </body>
</html>
