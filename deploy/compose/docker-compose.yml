# The Compose .env file supplies substitutions only; containers receive only
# the service-specific variables declared below.
# Other application settings use their program defaults unless added here.
services:
  api:
    image: ${IMAGE_REPOSITORY:-opskeeper}-api:${IMAGE_TAG:-local}
    environment:
      OPSK_LISTEN_PORT: ${OPSK_LISTEN_PORT:-8080}
      OPSK_DB_HOST: postgres:5432
      OPSK_DB_NAME: ${OPSK_DB_NAME:-opskeeper}
      OPSK_DB_USER: ${OPSK_DB_USER:-opskeeper}
      OPSK_DB_PASSWORD: ${OPSK_DB_PASSWORD:-opskeeper}
      # Containers must use Compose DNS; 127.0.0.1 in the root .env is for host-run binaries.
      OPSK_OTEL_ENDPOINT: http://otel-collector:4318
    ports:
      - "${OPSK_LISTEN_PORT:-8080}:${OPSK_LISTEN_PORT:-8080}"
    depends_on:
      - postgres
    restart: unless-stopped

  worker:
    image: ${IMAGE_REPOSITORY:-opskeeper}-worker:${IMAGE_TAG:-local}
    environment:
      OPSK_DB_HOST: postgres:5432
      OPSK_DB_NAME: ${OPSK_DB_NAME:-opskeeper}
      OPSK_DB_USER: ${OPSK_DB_USER:-opskeeper}
      OPSK_DB_PASSWORD: ${OPSK_DB_PASSWORD:-opskeeper}
      OPSK_OTEL_ENDPOINT: http://otel-collector:4318
    depends_on:
      - postgres
    restart: unless-stopped

  scheduler:
    image: ${IMAGE_REPOSITORY:-opskeeper}-scheduler:${IMAGE_TAG:-local}
    environment:
      OPSK_DB_HOST: postgres:5432
      OPSK_DB_NAME: ${OPSK_DB_NAME:-opskeeper}
      OPSK_DB_USER: ${OPSK_DB_USER:-opskeeper}
      OPSK_DB_PASSWORD: ${OPSK_DB_PASSWORD:-opskeeper}
      OPSK_OTEL_ENDPOINT: http://otel-collector:4318
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: opskeeper-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      OPSK_DB_NAME: ${OPSK_DB_NAME:-opskeeper}
      OPSK_DB_USER: ${OPSK_DB_USER:-opskeeper}
      OPSK_DB_PASSWORD: ${OPSK_DB_PASSWORD:-opskeeper}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/check-ready.sh:/usr/local/bin/opskeeper-postgres-ready:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/opskeeper-postgres-ready"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.67.0
    container_name: opskeeper-jaeger
    profiles: ["obs"]
    command: ["--collector.otlp.enabled=true"]
    ports:
      - "16686:16686"
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.121.0
    container_name: opskeeper-otel-collector
    profiles: ["obs"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - jaeger
      - prometheus
      - loki
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: opskeeper-prometheus
    profiles: ["obs"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.2
    container_name: opskeeper-loki
    profiles: ["obs"]
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    container_name: opskeeper-grafana
    profiles: ["obs"]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - jaeger
    restart: unless-stopped

volumes:
  postgres-data:
  prometheus-data:
  loki-data:
  grafana-data:
